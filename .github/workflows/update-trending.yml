name: Update Trending Equities & Precomputed Reports Cache

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-trending:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Precompute Live Trending Equities Reports
        run: |
          python stock_bot/precompute.py

      - name: Commit and Push Updated Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_bot/trending_cache.json stock_bot/precomputed_trending.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update trending equities & precomputed reports cache" && git push)
