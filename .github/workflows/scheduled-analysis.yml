name: Run Stock Analysis Cron & Commit Reports

on:
  schedule:
    # Runs daily at 06:00 UTC (Adjust as needed)
    - cron: "0 6 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analyze-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Analysis Bot for Watchlist Tickers
        run: |
          python analyse.py AAPL
          python analyse.py NVDA
          python analyse.py CBA.AX
          python analyse.py TSLA
          python analyse.py MSFT

      - name: Commit and Push Updated Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No changes in reports to commit."
          else
            git commit -m "auto: update stock analysis reports [skip ci]"
            git push
          fi
